---
layout: default
---
<article class="ye-article{% if page.photo_url %} ye-article--photo{% endif %}">
  {% unless page.photo_url %}
  {% if page.date %}
  <div class="ye-kicker">{{ page.date | date: "%B %-d, %Y" }}</div>
  {% endif %}
  <h1>{{ page.title }}</h1>
  {% endunless %}
  <div class="ye-article-body">{{ content }}</div>
</article>
